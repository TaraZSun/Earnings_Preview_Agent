[project]
name = "earnings-preview-agent"
version = "0.1.0"
description = "Generate earnings previews using market data, SEC filings, and OpenAI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai",
    "yfinance",
    "requests",
    "ddgs",
    "trafilatura",
    "curl_cffi",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earnings_preview"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["earnings_preview"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
